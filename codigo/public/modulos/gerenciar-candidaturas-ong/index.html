<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Candidaturas | Voluntarize</title>
  <link rel="stylesheet" href="../../design-system/css/globals.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" href="../../assets/images/logo/logo-icon.png" type="image/x-icon">
</head>
<body>

  <div id="header-global" data-header-class="site-header"></div>

  <main class="container section manage-page">

    <div class="manage-header surface surface-green">
      <div>
        <h1 class="h3" data-action-title>Carregando...</h1>
        <p class="text-sm text-muted" data-action-meta></p>
      </div>
      <a href="../home/home-ong.html" class="btn btn-secondary btn-pad-sm">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
    </div>

    <section class="status-section status-pending">
      <div class="status-heading">
        <span class="icon-token icon-purple icon-sm icon-square" aria-hidden="true">
          <i class="fa-regular fa-clock"></i>
        </span>
        <div>
          <h2 class="h4">Candidaturas Pendentes</h2>
          <p class="text-xs text-muted">Aguardando retorno da ONG</p>
        </div>
      </div>
      <div data-list-pending class="candidates-grid"></div>
    </section>

    <section class="status-section status-accepted">
      <div class="status-heading">
        <span class="icon-token icon-green icon-sm icon-square" aria-hidden="true">
          <i class="fa-solid fa-check"></i>
        </span>
        <div>
          <h2 class="h4">Candidaturas Aceitas</h2>
          <p class="text-xs text-muted">Voluntários confirmados</p>
        </div>
      </div>
      <div data-list-accepted class="candidates-grid"></div>
    </section>

    <section class="status-section status-rejected">
      <div class="status-heading">
        <span class="icon-token icon-white icon-sm icon-square" aria-hidden="true">
          <i class="fa-solid fa-xmark"></i>
        </span>
        <div>
          <h2 class="h4">Candidaturas Recusadas</h2>
          <p class="text-xs text-muted">Candidaturas não selecionadas</p>
        </div>
      </div>
      <div data-list-rejected class="candidates-grid"></div>
    </section>

  </main>

  <div class="container mb-4 mt-4">
    <footer class="site-footer">
      <img class="brand-logo" src="../../assets/images/logo/logo-horizontal.png" alt="Voluntarize" />
      <p class="text-sm">Plataforma de voluntários @ 2026 | Todos os direitos reservados</p>
    </footer>
  </div>

  <script src="../../js/global-header.js"></script>
  <script src="../../assets/js/dynamic-page.js"></script>
  <script src="./script.js"></script>
  <script src="./../../assets/js/redirect-to-profile.js"></script>
</body>
</html>
