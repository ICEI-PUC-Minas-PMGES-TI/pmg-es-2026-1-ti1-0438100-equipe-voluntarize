<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Vaga</title>
  <link rel="stylesheet" href="../../design-system/css/globals.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="details-page">
    <header class="surface grid items-center gap-4 details-header">
      <img class="details-logo" src="../../assets/images/logo/logo-horizontal.png" alt="Voluntarize">

      <nav class="flex items-center justify-center gap-4 details-nav" aria-label="Navegação principal">
        <a href="#">Início</a>
        <a href="#">Perfil</a>
        <a href="#">Vagas</a>
        <a href="#">Minhas Candidaturas</a>
      </nav>

      <button class="icon-token icon-purple profile-button" type="button" aria-label="Abrir perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </header>

    <section class="details-section" aria-labelledby="details-title">
      <div class="section-heading">
        <span></span>
        <h1 id="details-title">Detalhes da Vaga</h1>
        <span></span>
      </div>

      <article class="surface surface-purple grid details-card">
        <div class="flex flex-col details-card__content">
          <h2 class="surface surface-xs detail-title" data-action-title></h2>

          <div class="grid gap-1 detail-meta">
            <p class="surface surface-xs inline-flex items-center gap-1 meta-pill">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span data-action-location></span>
            </p>

            <p class="surface surface-xs inline-flex items-center gap-1 meta-pill meta-pill--short">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <path d="M16 2v4"></path>
                <path d="M8 2v4"></path>
                <path d="M3 10h18"></path>
              </svg>
              <span data-action-date></span>
            </p>
          </div>

          <p class="detail-description" data-action-description></p>

          <div class="flex flex-wrap gap-1 detail-tags" data-action-tags aria-label="Tags da vaga"></div>
        </div>

        <aside class="flex flex-col items-center justify-center gap-4 details-card__aside" aria-label="Imagem e inscrição da vaga">
          <figure class="surface surface-xs flex items-center justify-center detail-image">
            <img src="../../assets/images/imgs-undraw/img-home-banner-bolinhas-pessoas.svg" alt="">
          </figure>
          <button class="btn btn-primary btn-pad-xs detail-signup" type="button">Inscrever-se</button>
        </aside>
      </article>
    </section>

    <section class="details-section" aria-labelledby="organizer-title">
      <div class="section-heading">
        <span></span>
        <h2 id="organizer-title">Organizador</h2>
        <span></span>
      </div>

      <article class="surface surface-green grid items-center gap-4 organizer-card">
        <div class="icon-token icon-purple entity-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="organizer-card__info">
          <h3 data-ong-name></h3>
          <p>Por: <span data-ong-responsible></span></p>
        </div>

        <div class="grid gap-2 organizer-card__stats">
          <p class="surface surface-xs inline-flex items-center justify-center gap-1 rating-badge"><span data-ong-rating></span> ☆</p>
          <p class="surface surface-xs inline-flex items-center justify-center gap-1 followers-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-8 0v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M2 21v-2a4 4 0 0 1 3-3.87"></path>
            </svg>
            <span data-ong-followers></span> Seguidores
          </p>
        </div>
      </article>

      <button class="btn btn-secondary btn-pad-sm organizer-profile" type="button">Ver perfil da ONG</button>
    </section>

    <section class="details-section" aria-labelledby="participants-title">
      <div class="section-heading">
        <span></span>
        <h2 id="participants-title">Participantes</h2>
        <span></span>
      </div>

      <div class="grid gap-2 participants-grid" data-participants></div>
    </section>

    <footer class="surface surface-xs flex items-center justify-center details-footer">
      <img class="details-logo details-logo--footer" src="../../assets/images/logo/logo-horizontal.png" alt="Voluntarize">
      <p>Plataforma de voluntários © 2026 | Todos os direitos reservados</p>
    </footer>
  </main>

  <script src="./js/detalhes.js"></script>
</body>
</html>
