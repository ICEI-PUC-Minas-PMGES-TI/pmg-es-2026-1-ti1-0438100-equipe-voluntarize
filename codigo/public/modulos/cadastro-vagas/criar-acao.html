<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Ação</title>
  <link rel="stylesheet" href="../../design-system/css/globals.css">
  <link rel="stylesheet" href="./css/styles.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <main class="page">
    <button class="btn btn-secondary btn-shadow-sm btn-rounded-sm back-button" type="button" aria-label="Voltar para a página anterior">
      <i class="fa-solid fa-arrow-left-long" aria-hidden="true"></i>
      Voltar
    </button>

    <section class="action-card" aria-labelledby="form-title">
      <div class="illustration" aria-hidden="true">
        <img class="illustration__image" src="./img/undraw_my-resume_etai-1.svg" alt="">
      </div>

      <form class="stack action-form" id="criarAcaoForm">
        <header class="form-header">
          <h1 id="form-title">Criar ação</h1>
          <p>Crie uma ação e anuncie para encontrar voluntários</p>
        </header>

        <label class="field action-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input class="field-input" type="text" id="nomeAcao" name="nomeAcao" placeholder="Digite um nome para a ação" required>
        </label>

        <label class="field action-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 10c0 4.99-5.53 10.2-7.36 11.8a1 1 0 0 1-1.28 0C9.53 20.2 4 14.99 4 10a8 8 0 1 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </span>
          <input class="field-input" type="text" id="localizacao" name="localizacao" placeholder="Digite a localização onde a ação acontecerá" required>
        </label>

        <label class="field action-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <path d="M16 2v4"></path>
              <path d="M8 2v4"></path>
              <path d="M3 10h18"></path>
            </svg>
          </span>
          <input class="field-input" type="date" id="dataAcao" name="dataAcao" aria-label="Data da ação" required>
        </label>

        <label class="field action-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M16 21v-2a4 4 0 0 0-8 0v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M2 21v-2a4 4 0 0 1 3-3.87"></path>
            </svg>
          </span>
          <input class="field-input" type="number" id="quantidadeVagas" name="quantidadeVagas" min="1" step="1" placeholder="Digite a quantidade de vagas" required>
        </label>

        <label class="field field-textarea action-field action-field--textarea">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h10"></path>
              <path d="M4 12h7"></path>
              <path d="M4 17h5"></path>
              <path d="M16 15l2 2 4-4"></path>
            </svg>
          </span>
          <textarea class="field-input" id="descricao" name="descricao" placeholder="Digite a descrição da ação" rows="4" required></textarea>
        </label>

        <div class="action-tags-box" id="actionTagsBox">
          <div class="surface surface-sm stack gap-1 action-tags-box__inner">
            <span class="flex items-center gap-1 text-sm text-bold action-tags-label" id="tagsLabel">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.59 13.41 11 3.83A2.82 2.82 0 0 0 9 3H4a1 1 0 0 0-1 1v5a2.82 2.82 0 0 0 .83 2l9.58 9.59a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83Z"></path>
                <path d="M7.5 7.5h.01"></path>
              </svg>
              Selecione tags relacionadas à ação:
            </span>

            <div id="tagsSelecionadas" class="flex flex-wrap gap-1 action-tags-selected" aria-live="polite">
              <span class="font-alt text-xs text-muted action-tags-placeholder">Nenhuma tag selecionada</span>
            </div>

            <div class="flex items-center justify-between gap-2 action-tags-footer">
              <small id="tagsHelp" class="font-alt text-xs">Escolha pelo menos uma tag.</small>
              <button id="btnAddTag" class="btn btn-secondary btn-pad-xs action-btn-add" type="button" aria-label="Adicionar tag" aria-expanded="false" aria-controls="tagsDropdown">
                Adicionar
                <span aria-hidden="true">＋</span>
              </button>
            </div>
          </div>

          <div id="tagsDropdown" class="surface surface-sm flex flex-wrap gap-1 action-tags-dropdown" role="listbox" aria-labelledby="tagsLabel" aria-multiselectable="true" aria-hidden="true"></div>
        </div>

        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

        <div class="flex items-center justify-between gap-2 form-actions">
          <button class="btn btn-outline btn-pad-sm back-button" type="button">Voltar</button>
          <button class="btn btn-primary btn-pad-sm submit-button" type="submit">Concluir</button>
        </div>
      </form>
    </section>
  </main>

  <div class="container mb-4 footer-shell">
    <footer class="site-footer">
      <img class="brand-logo" src="../../assets/images/logo/logo-horizontal.png" alt="Voluntarize">
      <p class="text-sm">Plataforma de voluntários © 2026 | Todos os direitos reservados</p>
    </footer>
  </div>

  <script src="./js/criar-acao.js"></script>
  <script src="./../../assets/js/redirect-to-profile.js"></script>
</body>
</html>
