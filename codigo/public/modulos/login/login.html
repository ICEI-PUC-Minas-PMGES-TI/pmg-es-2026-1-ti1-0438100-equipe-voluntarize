<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Voluntarize</title>
  <link rel="stylesheet" href="../../design-system/css/globals.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" href="../../assets/images/logo/logo-icon.png" type="image/x-icon">
</head>
<body>

  <main class="login-layout">
    <div class="login-topbar">
      <button type="button" id="backButton"
              class="btn btn-secondary btn-shadow-sm btn-rounded-sm login-back-btn">
        <i class="fa-solid fa-arrow-left-long"></i>
        Voltar
      </button>
    </div>
    <div class="login-main">
      <aside class="login-illustration" aria-hidden="true">
        <img src="assets/fingerprint-login.svg" alt="" />
      </aside>
      <section class="surface login-card" aria-labelledby="loginTitle">
        <div class="login-card-header">
          <div class="surface surface-xs">
            ENTRAR
          </div>
        </div>

        <p class="font-alt text-sm text-center login-welcome">
          Que bom ver você por aqui novamente!
        </p>

        <form id="loginForm" class="stack gap-3" novalidate>
          <div class="stack gap-1">
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <i class="fa-regular fa-user"></i>
              </span>
              <input
                id="email"
                name="email"
                type="email"
                class="field-input"
                placeholder="Digite seu email"
                autocomplete="email"
                required
              />
            </div>
            <small id="erro-email" class="field-error" role="alert"></small>
          </div>
          <div class="stack gap-1">
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input
                id="senha"
                name="senha"
                type="password"
                class="field-input"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
              />
            </div>
            <small id="erro-senha" class="field-error" role="alert"></small>
          </div>

          <a href="#" class="login-forgot font-alt text-xs">
            Esqueci minha senha
          </a>
          <p id="formMessage"
             class="form-message font-alt text-sm text-center"
             role="alert"
             aria-live="polite"></p>
          <button type="submit"
                  class="btn btn-primary btn-pad-md btn-shadow-md w-full login-submit">
            Entrar
          </button>
          <p class="font-alt text-xs text-center login-register">
            Ainda não tem uma conta?
            <a href="../cadastro-usuario/index.html" class="text-bold">Cadastra-se!</a>
          </p>
        </form>
      </section>
    </div>
  </main>

  <script src="js/login-local.js"></script>
</body>
</html>
