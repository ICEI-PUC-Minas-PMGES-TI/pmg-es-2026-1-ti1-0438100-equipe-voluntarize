<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login de Usuario</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login-local.js" defer></script>
</head>

<body>
  <main class="login-page">
    <button class="back-button" type="button" id="backButton">Voltar</button>

    <section class="login-shell">
      <aside class="illustration-panel" aria-hidden="true">
        <img src="assets/fingerprint-login.svg" alt="">
      </aside>

      <section class="login-card" aria-labelledby="loginTitle">
        <form id="loginForm" novalidate>
          <div class="heading">
            <span class="title-box" id="loginTitle">Entrar</span>
            <p>Que bom ver voce por aqui novamente!</p>
          </div>

          <label class="sr-only" for="email">E-mail</label>
          <div class="input-box">
            <span class="field-icon user-icon" aria-hidden="true"></span>
            <input id="email" name="email" type="email" placeholder="Digite seu email" autocomplete="email" required>
          </div>
          <small class="field-error" id="erro-email"></small>

          <label class="sr-only" for="senha">Senha</label>
          <div class="input-box">
            <span class="field-icon lock-icon" aria-hidden="true"></span>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
          <small class="field-error" id="erro-senha"></small>

          <a class="forgot-link" href="#">Esqueci minha senha</a>
          <p class="form-message" id="formMessage" role="alert" aria-live="polite"></p>

          <button class="primary-button" type="submit">Entrar</button>
          <p class="register-link">Ainda nao tem uma conta? <a href="../cadastro-usuario/index.html">Cadastra-se!</a></p>
        </form>
      </section>
    </section>
  </main>
</body>

</html>
