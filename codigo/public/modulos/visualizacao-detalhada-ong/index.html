<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil da ONG | Voluntarize</title>

  
  <link rel="stylesheet" href="../../design-system/css/globals.css">

  
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    
  
  <link rel="stylesheet" href="style.css">
</head>

<body>

  
  <div class="container header-shell">

    <header class="site-header">

      <img
        class="brand-logo"
        src="https://dummyimage.com/140x40/ffffff/000000&text=Voluntarize"
        alt="Voluntarize"
      />

      <nav class="site-nav">
        <a href="#">Início</a>
        <a href="#">Perfil</a>
        <a href="#">Vagas</a>
        <a href="#">Minhas candidaturas</a>
      </nav>

      <button class="btn btn-secondary btn-icon-only btn-rounded-full btn-shadow-sm" aria-label="Usuário" onclick="redirectToProfile()">
        <i class="fa-regular fa-user"></i>
      </button>

    </header>

  </div>

  <!-- MAIN -->
  <main class="container section stack gap-4">

    <!-- TOPO ONG -->
    <section class="surface surface-green surface-lg">

      <div class="flex justify-between items-center flex-wrap gap-4">

        <!-- ESQUERDA -->
        <div class="flex items-center gap-3">

          <span class="icon-token icon-lg icon-purple">
            <i class="fa-regular fa-user"></i>
          </span>

          <div class="stack gap-1">

            <h1 class="h3" data-ong-name></h1>
            <p class="text-sm" data-ong-responsible></p>
            <p class="text-xs text-muted" data-ong-since></p>

          </div>

        </div>

        <!-- DIREITA -->
        <div class="stack items-end gap-2">

          <span class="tag tag-white tag-sm" data-ong-rating></span>
          <span class="text-sm text-semibold" data-ong-followers></span>
          <button class="btn btn-secondary btn-pad-sm btn-seguir">Seguir</button>

        </div>

      </div>

    </section>

    <!-- DIVIDER -->
    <div class="divider-label">
      <span>História da ONG</span>
    </div>

    <!-- HISTORIA -->
    <section class="grid grid-2 gap-4">

      <!-- TEXTO -->
      <div class="surface stack">

        <div>
          <span class="tag tag-purple">
            Conheça um pouco mais sobre a ONG
          </span>
        </div>

        <p class="text-sm font-alt" data-ong-description></p>

      </div>

      <!-- CELULAR -->
      <div class="surface surface-purple phone-box">

        <div class="phone-frame">

          <div class="phone-notch"></div>

          <div class="phone-content">

            <span class="icon-token icon-lg icon-white">
              <i class="fa-solid fa-heart"></i>
            </span>

            <div class="phone-lines">
              <span></span>
              <span></span>
              <span></span>
            </div>

          </div>

        </div>

      </div>

    </section>

    
    <div class="divider-label">
      <span>Histórico de Ações</span>
    </div>

  
    <section class="actions-wrapper">

      <button class="btn btn-secondary btn-icon-only btn-pad-xs">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="grid grid-2 grow" data-actions-list></div>

      <button class="btn btn-secondary btn-icon-only btn-pad-xs">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

    </section>

    <!-- DIVIDER -->
    <div class="divider-label">
      <span>Avaliações</span>
    </div>

    <!-- REVIEWS -->
    <section class="surface surface-purple stack">

      <div class="reviews-alert">

        <i class="fa-solid fa-check"></i>

        <p class="text-sm text-bold">
          Veja o que os usuários disseram sobre o trabalho dessa ONG
        </p>

      </div>

      <div class="grid grid-3" data-reviews-list></div>

    </section>

  </main>
  
  <!-- FOOTER -->
  <div class="container mb-4">

    <footer class="site-footer">

      <img
        class="brand-logo"
        src="https://dummyimage.com/140x40/ffffff/000000&text=Voluntarize"
        alt="Voluntarize"
      />

      <p class="text-sm">
        Plataforma de voluntários @ 2026
      </p>

    </footer>

  </div>
  <script src="script.js"></script>
  <script src="./../../assets/js/redirect-to-profile.js"></script>
</body>
</html>
