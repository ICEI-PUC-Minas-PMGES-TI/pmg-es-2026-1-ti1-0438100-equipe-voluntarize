<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de ONG</title>
  <link rel="stylesheet" href="../../design-system/css/globals.css">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="js/cadastro-ong.js?v=5" defer></script>
</head>

<body>
  <main class="cadastro-page">
    <button class="btn btn-secondary btn-shadow-sm btn-rounded-sm back-button" type="button" id="backButton" aria-label="Voltar" hidden>
      <i class="fa-solid fa-arrow-left-long" aria-hidden="true"></i>
      Voltar
    </button>

    <section class="choice-card" id="choiceScreen" aria-labelledby="choiceTitle">
      <span class="btn btn-outline btn-pad-sm btn-shadow-sm title-pill" id="choiceTitle">Cadastrar</span>
      <p>Selecione o tipo de cadastro que mais se adequa a voce:</p>

      <div class="choice-options">
        <button class="choice-option selected" type="button" id="selectOng" data-register-type="ongs" aria-pressed="true">
          <img src="assets/successful-group.svg" alt="">
          <span>ONG</span>
        </button>

        <button class="choice-option" type="button" id="selectVolunteer" data-register-type="volunteers" aria-pressed="false">
          <img src="assets/successful-person.svg" alt="">
          <span>Voluntario</span>
        </button>
      </div>

      <button class="btn btn-primary btn-pad-md btn-shadow-md primary-button" type="button" id="startOng">Prosseguir</button>
      <p class="login-link">Ja tem uma conta? <a href="../login/login.html">Entrar!</a></p>
    </section>

    <section class="cadastro-shell" id="registerScreen" aria-labelledby="cadastroTitulo" hidden>
      <aside class="illustration-panel" aria-hidden="true">
        <img id="stepIllustration" src="assets/successful-group.svg" alt="">
      </aside>

      <section class="cadastro-card">
        <form class="cadastro-form" id="ongForm" novalidate>
          <div class="card-heading">
            <span class="btn btn-outline btn-pad-sm btn-shadow-sm title-pill" id="cadastroTitulo">Cadastro</span>
            <p id="stepIntro">Venha fazer parte dessa comunidade!</p>
          </div>

          <div class="form-step" data-step="0">
            <div class="field-group">
              <label for="nomeOng">Nome da ONG</label>
              <div class="input-shell">
                <input id="nomeOng" name="nomeOng" type="text" placeholder="Digite o nome da ONG" autocomplete="organization" required>
              </div>
              <small class="field-error" id="erro-nomeOng"></small>
            </div>

            <div class="field-group">
              <label for="email">E-mail</label>
              <div class="input-shell">
                <input id="email" name="email" type="email" placeholder="Digite o email" autocomplete="email" required>
              </div>
              <small class="field-error" id="erro-email"></small>
            </div>

            <div class="field-group">
              <label for="senha">Senha</label>
              <div class="input-shell">
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="new-password" required>
              </div>
              <small class="field-error" id="erro-senha"></small>
            </div>

            <div class="field-group">
              <label for="confirmarSenha">Confirmar senha</label>
              <div class="input-shell">
                <input id="confirmarSenha" name="confirmarSenha" type="password" placeholder="Confirme sua senha" autocomplete="new-password" required>
              </div>
              <small class="field-error" id="erro-confirmarSenha"></small>
            </div>
          </div>

          <div class="form-step" data-step="1" hidden>
            <div class="field-group">
              <label for="telefone">Telefone da ONG</label>
              <div class="input-shell">
                <input id="telefone" name="telefone" type="tel" placeholder="Digite o telefone da ONG" autocomplete="tel" required>
              </div>
              <small class="field-error" id="erro-telefone"></small>
            </div>

            <div class="field-group">
              <label for="cnpj">CNPJ da ONG</label>
              <div class="input-shell">
                <input id="cnpj" name="cnpj" type="text" placeholder="Digite o CNPJ da ONG" inputmode="numeric" required>
              </div>
              <small class="field-error" id="erro-cnpj"></small>
            </div>

            <div class="field-group">
              <label for="cep">CEP da ONG</label>
              <div class="input-shell">
                <input id="cep" name="cep" type="text" placeholder="Digite o CEP da ONG" inputmode="numeric" autocomplete="postal-code" required>
              </div>
              <small class="field-error" id="erro-cep"></small>
            </div>

            <div class="field-group">
              <label for="dataFundacao">Data de fundacao</label>
              <div class="input-shell">
                <input id="dataFundacao" name="dataFundacao" type="text" placeholder="Digite a data de fundacao" inputmode="numeric" required>
              </div>
              <small class="field-error" id="erro-dataFundacao"></small>
            </div>
          </div>

          <div class="form-step" data-step="2" hidden>
            <div class="field-group">
              <label for="responsavel">Nome do responsavel</label>
              <div class="input-shell">
                <input id="responsavel" name="responsavel" type="text" placeholder="Nome completo do responsavel" autocomplete="name" required>
              </div>
              <small class="field-error" id="erro-responsavel"></small>
            </div>

            <div class="field-group">
              <label for="cpfResponsavel">CPF do responsavel</label>
              <div class="input-shell">
                <input id="cpfResponsavel" name="cpfResponsavel" type="text" placeholder="Digite o CPF do responsavel" inputmode="numeric" required>
              </div>
              <small class="field-error" id="erro-cpfResponsavel"></small>
            </div>

            <div class="field-group">
              <label for="emailResponsavel">E-mail do responsavel</label>
              <div class="input-shell">
                <input id="emailResponsavel" name="emailResponsavel" type="email" placeholder="Digite o email do responsavel" autocomplete="email" required>
              </div>
              <small class="field-error" id="erro-emailResponsavel"></small>
            </div>

            <div class="field-group">
              <label for="nascimentoResponsavel">Data de nascimento</label>
              <div class="input-shell">
                <input id="nascimentoResponsavel" name="nascimentoResponsavel" type="text" placeholder="Digite a data de nascimento" inputmode="numeric" required>
              </div>
              <small class="field-error" id="erro-nascimentoResponsavel"></small>
            </div>
          </div>

          <div class="form-step" data-step="3" hidden>
            <div class="field-group">
              <label for="site">URL do site ou redes sociais</label>
              <div class="input-shell">
                <input id="site" name="site" type="url" placeholder="URL do site ou redes sociais">
              </div>
              <small class="field-error" id="erro-site"></small>
            </div>

            <div class="field-group">
              <label for="historia">Historia da ONG</label>
              <div class="input-shell textarea-shell">
                <textarea id="historia" name="historia" rows="5" placeholder="Digite a historia da ONG..." required></textarea>
              </div>
              <small class="helper-text">Essa informacao sera exibida no perfil da ONG.</small>
              <small class="field-error" id="erro-historia"></small>
            </div>
          </div>

          <p class="form-message" id="formMessage" role="alert" aria-live="polite"></p>

          <div class="form-actions">
            <button class="btn btn-ghost btn-pad-sm secondary-button" type="button" id="prevStep">Voltar</button>
            <button class="btn btn-primary btn-pad-sm btn-shadow-md primary-button" type="button" id="nextStep">Proximo</button>
            <button class="btn btn-primary btn-pad-sm btn-shadow-md primary-button" type="submit" id="submitForm" hidden>Cadastrar</button>
          </div>

          <p class="login-link">Ja tem uma conta? <a href="../login/login.html">Entrar!</a></p>

          <div class="step-dots" aria-label="Etapas do cadastro">
            <span class="step-dot dot active"></span>
            <span class="step-dot dot"></span>
            <span class="step-dot dot"></span>
            <span class="step-dot dot"></span>
          </div>
        </form>

        <section class="success-panel" id="successPanel" hidden>
          <img src="assets/successful-group.svg" alt="">
          <h2>Cadastro realizado!</h2>
          <p>Os dados da ONG foram salvos com sucesso.</p>
          <a class="btn btn-primary btn-pad-sm btn-shadow-md primary-button" href="../login/login.html">Entrar</a>
        </section>
      </section>
    </section>
  </main>
  <script src="./../../assets/js/redirect-to-profile.js"></script>
</body>
</html>
